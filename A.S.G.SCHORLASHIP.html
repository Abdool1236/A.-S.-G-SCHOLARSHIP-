<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A. S. G SCHOLARSHIP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8f0;
            margin: 0;
            padding: 10px;
        }

        h1 {
            color: white;
            background-color: green;
            text-align: center;
            padding: 25px 10px;
            font-size: 27px;
            margin: 0;
        }

        h2 {
            color: green;
            text-align: center;
            font-size: 20px;
        }

        .description {
            text-align: center;
            color: #333;
            font-size: 15px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        h3 {
            color: green;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background-color: green;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        footer {
            text-align: center;
            color: #555555;
            font-size: 13px;
            margin: 25px 0 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>A. S. G SCHOLARSHIP</h1>
        <h2>Scholarship Application Portal</h2>
<form action="https://formsubmit.co/abdullahisanigarba26@gmail.com"
      method="POST">
        <p class="description">
            Welcome! This portal is for university and college students.
            Please provide your correct information below.
        </p>
    </header>

    <div class="container">

        <h3>Student Registration Form</h3>

        <form action="https://formsubmit.co/abdullahisanigarba26@gmail.com"
              method="POST">

            <label for="firstName">First Name:</label>
            <input type="text"
                   id="firstName"
                   name="First Name"
                   placeholder="Enter your first name"
                   autocomplete="given-name"
                   required>

            <label for="secondName">Second Name:</label>
            <input type="text"
                   id="secondName"
                   name="Second Name"
                   placeholder="Enter your second name"
                   autocomplete="family-name"
                   required>

            <label for="otherName">Other Name:</label>
            <input type="text"
                   id="otherName"
                   name="Other Name"
                   placeholder="Enter your other name">

            <label for="email">Email Address:</label>
            <input type="email"
                   id="email"
                   name="Email Address"
                   placeholder="Enter your email address"
                   autocomplete="email"
                   required>

            <label for="phone">Phone Number:</label>
            <input type="tel"
                   id="phone"
                   name="Phone Number"
                   placeholder="Enter your phone number"
                   autocomplete="tel"
                   required>

            <label for="institution">University or College:</label>
            <input type="text"
                   id="institution"
                   name="Institution"
                   placeholder="Enter your institution"
                   required>

            <label for="course">Course of Study:</label>
            <input type="text"
                   id="course"
                   name="Course of Study"
                   placeholder="Enter your course"
                   required>

            <label for="level">Current Level:</label>
            <select id="level" name="Current Level" required>
                <option value="">Select your level</option>
                <option value="100 Level">100 Level</option>
                <option value="200 Level">200 Level</option>
                <option value="300 Level">300 Level</option>
                <option value="400 Level">400 Level</option>
                <option value="500 Level">500 Level</option>
                <option value="Other">Other</option>
            </select>

            <label for="state">State of Institution:</label>
            <input type="text"
                   id="state"
                   name="State of Institution"
                   placeholder="Enter the state"
                   required>

            <input type="hidden"
                   name="_subject"
                   value="New A. S. G Scholarship Application">

            <button type="submit">Submit Application</button>

        </form>

    </div>

    <footer>
        <p>&copy; 2026 A. S. G SCHOLARSHIP. All rights reserved.</p>
    </footer>

</body>
</html>
